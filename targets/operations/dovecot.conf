# INTENTIONAL LAB WEAKNESS: cleartext IMAP and password authentication are
# confined to the Docker-internal Operations LAN for plaintext-protocol and
# password-reuse training. Do not copy this configuration to a real system.
protocols = imap
listen = 172.30.20.20
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:~/Maildir

passdb {
  driver = pam
}

userdb {
  driver = passwd
}

log_path = /dev/stderr
info_log_path = /dev/stdout
