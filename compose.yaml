name: dawnstar-range

services:
  attacker:
    container_name: attacker
    build:
      context: .
      dockerfile: attacker/Dockerfile
      target: episode-08
    hostname: kali
    command: ["sleep", "infinity"]
    networks:
      dmz:
        ipv4_address: 172.30.10.20
    healthcheck:
      test: ["CMD-SHELL", "ip -brief address >/dev/null && nmap --version >/dev/null && command -v nc >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: "no"

  perimeter:
    container_name: perimeter
    build:
      context: .
      dockerfile: targets/perimeter/Dockerfile
    hostname: perimeter
    environment:
      LAB_EPISODE: "01"
    networks:
      dmz:
        ipv4_address: 172.30.10.10
      operations_lan:
        ipv4_address: 172.30.20.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.10.10 21 && nc -z 172.30.10.10 22 && nc -z 172.30.10.10 80 && nc -z 172.30.10.10 4040"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: "no"

  operations:
    container_name: operations-server
    build:
      context: .
      dockerfile: targets/operations/Dockerfile
    hostname: operations
    environment:
      LAB_EPISODE: "01"
    networks:
      operations_lan:
        ipv4_address: 172.30.20.20
      research_lan:
        ipv4_address: 172.30.30.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.20.20 22 && nc -z 172.30.20.20 143"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: "no"

  vault:
    container_name: vault
    build:
      context: .
      dockerfile: targets/vault/Dockerfile
    hostname: vault
    environment:
      LAB_EPISODE: "01"
    networks:
      research_lan:
        ipv4_address: 172.30.30.20
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('172.30.30.20', 445), 2).close()\""]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: "no"

networks:
  dmz:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  operations_lan:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  research_lan:
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24
